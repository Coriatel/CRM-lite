# Owner-approved 2026-09-28: Caddy reads the Drive-webhook token from the secrets store
# (secrets-materialize caddy-drive-webhook). Leading '-': a missing file breaks only that route.
[Service]
EnvironmentFile=-/etc/ai-secrets/caddy-drive-webhook.env
# Stock line (caddy 2.6.2 package): ExecStart=/usr/bin/caddy run --environ --config /etc/caddy/Caddyfile
# --environ is dropped because it prints the whole environment, token included, to the journal.
# Re-check `systemctl cat caddy` after caddy package upgrades.
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
