name: Secret hygiene

on:
  pull_request:
  pull_request_target:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  added-line-scan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Verify scanner
        run: python3 -m unittest tests/test_scan_added_secrets.py
      - name: Fetch proposed commits without checking out proposed code
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git -c credential.helper='!f() { printf "%s\n" "username=x-access-token" "password=$GH_TOKEN"; }; f' \
            fetch --no-tags origin "pull/$PR_NUMBER/head"
      - name: Reject added hardcoded secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/scan_added_secrets.py --commits "$BASE_SHA..$HEAD_SHA"

  bootstrap-added-line-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify scanner
        run: python3 -m unittest tests/test_scan_added_secrets.py
      - name: Reject added hardcoded secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/scan_added_secrets.py --commits "$BASE_SHA..$HEAD_SHA"
