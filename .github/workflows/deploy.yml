name: Deploy CRM Lite

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer run waits for the running one instead of racing its publish.
concurrency:
  group: deploy-crmlite
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: crm-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: crm-app

      - name: Build
        run: npm run build
        working-directory: crm-app

      # Stamp the build with the commit it came from. Without this the deploy has
      # no way to ask production what it is actually serving, and every check
      # below would only prove that *something* is being served.
      - name: Stamp build with commit SHA
        run: |
          printf '{"sha":"%s","built_at":"%s"}\n' \
            '${{ github.sha }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > crm-app/dist/build-info.json

      - name: Check the build is complete
        run: |
          test -f crm-app/dist/index.html || { echo 'build has no index.html'; exit 1; }
          test -f crm-app/dist/build-info.json || { echo 'build has no build-info.json'; exit 1; }
          ls crm-app/dist/assets/index-*.js >/dev/null || { echo 'build has no main bundle'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: crm-app-dist
          path: crm-app/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Production is mn-home since 2026-10-27 (server migration G2). Host Caddy serves
  # /data/services/crmlite/web as a plain file_server, so a deploy is a file publish:
  # nothing is restarted and no container is involved.
  #
  # The runner is dedicated to this job: registered to this repo only, label
  # mnhome-crmlite-deploy and no default labels, an unprivileged user that can write
  # only the web root and its backups, with no sudo, no docker and no loopback/LAN
  # access. This repo is public, so a host-side job-started hook refuses every job
  # except this workflow on main, triggered by a push or a manual dispatch.
  deploy:
    needs: build
    runs-on: mnhome-crmlite-deploy
    timeout-minutes: 15
    env:
      WEB: /data/services/crmlite/web
      BAK: /data/services/crmlite/backups
    steps:
      # No production deploys on Shabbat or Yom Tov. Same sources as the host's
      # shabbat-mode: /opt/shabbat-mode/status (written by shabbat-manager) and its
      # shabbat-times.json windows, from 60 min before candle lighting to havdalah.
      # Fails closed: an unreadable or unexpected state refuses the deploy.
      - name: Shabbat / Yom Tov hold
        run: |
          python3 -I - <<'PY'
          import datetime as dt, json, sys
          d = "/opt/shabbat-mode/"
          status = open(d + "status").read().strip()
          if status != "off":
              sys.exit(f"Shabbat/Yom Tov hold: {d}status = {status!r}. Not deploying; re-run this workflow after havdalah.")
          now = dt.datetime.now(dt.timezone.utc)
          for p in json.load(open(d + "shabbat-times.json"))["periods"]:
              start = dt.datetime.fromisoformat(p["candle_date"]) - dt.timedelta(minutes=60)
              end = dt.datetime.fromisoformat(p["havdalah_date"])
              if start <= now <= end:
                  sys.exit(f"Shabbat/Yom Tov hold: {start.isoformat()} to {end.isoformat()}. Not deploying; re-run this workflow after havdalah.")
          print("Shabbat/Yom Tov hold: open (status off, outside every listed window)")
          PY

      - uses: actions/download-artifact@v4
        with:
          name: crm-app-dist
          path: ${{ runner.temp }}/dist

      # Idempotent: if the web root already holds exactly this build, nothing is
      # written. Otherwise the current tree is copied to $BAK (last 3 kept), then two
      # rsync passes (--checksum: a same-size file within the same mtime second is
      # still replaced): additive first, so no moment exists where a new index.html
      # points at assets that are not there yet; then --delete to retire old files.
      # The step ends by proving the web root is byte-identical to the build.
      - name: Publish to the web root (idempotent) and prove it on disk
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/dist"
          test -f "$SRC/index.html" || { echo 'artifact has no index.html, abort'; exit 1; }
          ls "$SRC"/assets/index-*.js >/dev/null || { echo 'artifact has no main bundle, abort'; exit 1; }
          grep -q "\"sha\":\"$GITHUB_SHA\"" "$SRC/build-info.json" || { echo "artifact is not $GITHUB_SHA, abort"; exit 1; }
          manifest() { (cd "$1" && LC_ALL=C find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16); }
          want=$(manifest "$SRC")
          if [ "$(manifest "$WEB")" = "$want" ]; then
            echo "web root already holds this build (manifest $want): nothing to publish"
          else
            prev=$(grep -o '"sha":"[0-9a-f]*"' "$WEB/build-info.json" 2>/dev/null | cut -d'"' -f4 | cut -c1-7 || true)
            keep="$BAK/web.${prev:-unknown}.$(date -u +%Y%m%dT%H%M%SZ)"
            cp -a "$WEB" "$keep"
            rsync -rt --checksum --chmod=D755,F644 "$SRC/" "$WEB/"
            rsync -rt --checksum --chmod=D755,F644 --delete "$SRC/" "$WEB/"
            ls -1dt "$BAK"/web.* | tail -n +4 | xargs -r rm -rf
            echo "published ${GITHUB_SHA:0:7}; previous tree (${prev:-unknown}) kept at $keep"
          fi
          got=$(manifest "$WEB")
          [ "$got" = "$want" ] || { echo "FAILED: web root manifest $got != build $want"; exit 1; }
          echo "on disk: web root manifest $got = this build"

      # A 200 alone proves nothing (a days-old tree answers 200 too, 2026-09-07), so
      # the edge must report this commit in build-info.json and serve /ops.
      - name: Health check, the public edge serves this commit
        run: |
          set -u
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -m 15 -w '%{http_code}' https://crmphone.merkazneshama.co.il/ops || echo 000)
            live=$(curl -sS -m 15 -H 'Cache-Control: no-cache' "https://crmphone.merkazneshama.co.il/build-info.json?v=$GITHUB_SHA" 2>/dev/null | tr -d '[:space:]' || true)
            case "$live" in
              *"\"sha\":\"$GITHUB_SHA\""*) serving=1 ;;
              *) serving=0 ;;
            esac
            if [ "$code" = 200 ] && [ "$serving" = 1 ]; then
              echo "health OK: /ops 200 and the edge serves ${GITHUB_SHA:0:7}"
              exit 0
            fi
            echo "health retry $i: /ops=$code build-info=${live:-<none>}"
            sleep 5
          done
          echo 'health FAILED: the public edge is not serving this commit'
          exit 1
